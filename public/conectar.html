<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>AirLink - Conectar con Laptop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AirLink">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 26, 43, 0.85);
      --card-border: rgba(255, 255, 255, 0.09);
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --radius-lg: 24px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    .glow {
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.22;
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 { top: -60px; left: -60px; background: #6366f1; }
    .glow-2 { bottom: -60px; right: -60px; background: #d946ef; }

    .connector-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      background: var(--primary-gradient);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
      color: #fff;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    h1 span {
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.45;
    }

    /* Estado de Conexión Automática / Reconexión */
    .status-box {
      padding: 24px 18px;
      background: rgba(255, 255, 255, 0.035);
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.07);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .spinner-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }

    .status-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Botones */
    .btn {
      width: 100%;
      padding: 15px;
      border-radius: var(--radius-md);
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: #fff;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.45);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Visor de Cámara QR */
    .scanner-wrap {
      width: 100%;
      height: 250px;
      background: #000;
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
      margin-bottom: 14px;
    }

    #scannerVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scanner-laser {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: #8b5cf6;
      box-shadow: 0 0 14px 3px #8b5cf6;
      animation: scanLaser 2s infinite ease-in-out alternate;
    }

    @keyframes scanLaser {
      0% { top: 5%; }
      100% { top: 95%; }
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer-help {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #64748b;
      line-height: 1.4;
    }

    .footer-help strong {
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <main class="connector-card">
    <div class="brand-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
    </div>

    <h1>AirLink <span>Express</span></h1>
    <p class="subtitle" id="mainSubtitle">Vinculación permanente tipo WhatsApp Web</p>

    <!-- Estado: Reconectando con Laptop Vinculada -->
    <div id="connectingSection" class="status-box">
      <div class="spinner-ring" id="statusSpinner"></div>
      <div class="status-title" id="statusTitle">Conectando con tu Laptop...</div>
      <div class="status-desc" id="statusDesc">Sincronizando sesión permanente con tu computadora.</div>
    </div>

    <!-- Visor de Escáner QR de Cámara -->
    <div id="scannerSection" style="display: none;">
      <div class="scanner-wrap">
        <video id="scannerVideo" playsinline></video>
        <div class="scanner-laser"></div>
      </div>
      <button class="btn btn-secondary" id="btnCancelScan" type="button" style="margin-bottom: 12px;">Cancelar Escáner</button>
    </div>

    <div class="action-group" id="actionGroup">
      <button class="btn btn-primary" id="btnScanQr" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Escanear QR de mi Laptop</span>
      </button>
      <button class="btn btn-secondary" id="btnRetryConnect" type="button" style="display: none;">
        <span>🔄 Reintentar Conexión</span>
      </button>
    </div>

    <div class="footer-help">
      Verifica que en tu laptop esté abierto <strong>Iniciar_Transferencia.bat</strong>
    </div>
  </main>

  <script>
    const PAIR_STORAGE_KEY = 'airlink_pair_id';
    const connectingSection = document.getElementById('connectingSection');
    const statusSpinner = document.getElementById('statusSpinner');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');
    const btnScanQr = document.getElementById('btnScanQr');
    const btnRetryConnect = document.getElementById('btnRetryConnect');
    const scannerSection = document.getElementById('scannerSection');
    const scannerVideo = document.getElementById('scannerVideo');
    const btnCancelScan = document.getElementById('btnCancelScan');
    const actionGroup = document.getElementById('actionGroup');

    let activeStream = null;
    let scanInterval = null;

    // Validar formatos seguros para evitar Open Redirect / Inyección
    function isValidPairId(id) {
      return typeof id === 'string' && /^air_[a-f0-9]{16,64}$/i.test(id);
    }

    function isAllowedTargetUrl(rawUrl) {
      try {
        const u = new URL(rawUrl);
        if (u.protocol === 'https:' && (u.hostname.endsWith('.trycloudflare.com') || u.hostname.endsWith('.github.io'))) {
          return true;
        }
        if (u.protocol === 'http:') {
          return u.hostname === 'localhost' ||
            /^192\.168\.\d{1,3}\.\d{1,3}$/.test(u.hostname) ||
            /^10\.\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(u.hostname) ||
            /^172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}$/.test(u.hostname);
        }
        return false;
      } catch (e) {
        return false;
      }
    }

    // Detectar si ya venía un código ?pair= en la URL
    const urlParams = new URLSearchParams(window.location.search);
    const incomingPairId = urlParams.get('pair');
    if (isValidPairId(incomingPairId)) {
      localStorage.setItem(PAIR_STORAGE_KEY, incomingPairId);
    }

    async function checkDirectConnection() {
      try {
        const c = new AbortController();
        const t = setTimeout(() => c.abort(), 1200);
        const res = await fetch('/api/info', { signal: c.signal });
        clearTimeout(t);
        if (res.ok) {
          window.location.href = '/';
          return true;
        }
      } catch (e) {}
      return false;
    }

    async function locateLaptopByPairId(pairId) {
      if (!isValidPairId(pairId)) {
        statusSpinner.style.display = 'none';
        statusTitle.textContent = 'Código de vinculación inválido';
        statusDesc.textContent = 'Escanea nuevamente el código QR desde tu laptop.';
        return;
      }
      statusTitle.textContent = 'Buscando tu Laptop vinculada...';
      statusDesc.textContent = 'Verificando sesión activa de tu computadora...';
      btnRetryConnect.style.display = 'none';

      try {
        const res = await fetch(`https://ntfy.sh/airlink_hub_${pairId}/json?poll=1&since=24h`);
        if (!res.ok) throw new Error('No se pudo consultar el servidor de emparejamiento');
        
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        if (lines.length === 0) {
          throw new Error('Tu laptop no está activa en este momento. Abre Iniciar_Transferencia.bat en tu laptop para conectar.');
        }

        let latest = null;
        for (let i = lines.length - 1; i >= 0; i--) {
          try {
            const p = JSON.parse(lines[i]);
            if (p.message) {
              const d = JSON.parse(p.message);
              if (d && (d.publicUrl || d.localUrl)) {
                latest = d;
                break;
              }
            }
          } catch (err) {}
        }

        if (!latest) throw new Error('Sesión no encontrada en tu laptop.');

        // Probar si la red local Wi-Fi responde súper rápido
        let targetUrl = latest.publicUrl;
        if (latest.localUrl) {
          try {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), 700);
            const ping = await fetch(`${latest.localUrl}/api/info`, { signal: c.signal });
            clearTimeout(t);
            if (ping && ping.ok) targetUrl = latest.localUrl;
          } catch (err) {}
        }

        if (!targetUrl || !isAllowedTargetUrl(targetUrl)) throw new Error('Enlace de sesión no válido o expirado.');

        statusTitle.textContent = '¡Laptop encontrada! Conectando...';
        statusDesc.textContent = targetUrl;
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 200);

      } catch (err) {
        statusSpinner.style.display = 'none';
        statusTitle.textContent = 'Laptop desconectada';
        statusDesc.textContent = err.message || 'Abre Iniciar_Transferencia.bat en tu computadora para conectar.';
        btnRetryConnect.style.display = 'flex';
      }
    }

    // Iniciar escaneo con cámara
    async function startQrScanner() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Tu navegador no permite acceso directo a la cámara.');
        return;
      }
      try {
        connectingSection.style.display = 'none';
        actionGroup.style.display = 'none';
        scannerSection.style.display = 'block';

        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }
        });
        scannerVideo.srcObject = activeStream;
        await scannerVideo.play();

        if ('BarcodeDetector' in window) {
          const detector = new BarcodeDetector({ formats: ['qr_code'] });
          scanInterval = setInterval(async () => {
            try {
              const barcodes = await detector.detect(scannerVideo);
              if (barcodes && barcodes.length > 0) {
                const detected = barcodes[0].rawValue;
                if (isAllowedTargetUrl(detected)) {
                  stopQrScanner();
                  window.location.href = detected;
                }
              }
            } catch (e) {}
          }, 250);
        }
      } catch (err) {
        stopQrScanner();
        alert('No se pudo acceder a la cámara.');
      }
    }

    function stopQrScanner() {
      if (scanInterval) {
        clearInterval(scanInterval);
        scanInterval = null;
      }
      if (activeStream) {
        activeStream.getTracks().forEach(t => t.stop());
        activeStream = null;
      }
      scannerSection.style.display = 'none';
      connectingSection.style.display = 'flex';
      actionGroup.style.display = 'flex';
    }

    btnScanQr.addEventListener('click', startQrScanner);
    btnCancelScan.addEventListener('click', stopQrScanner);
    btnRetryConnect.addEventListener('click', () => {
      statusSpinner.style.display = 'block';
      const pairId = localStorage.getItem(PAIR_STORAGE_KEY);
      if (pairId) locateLaptopByPairId(pairId);
      else checkDirectConnection();
    });

    window.addEventListener('load', async () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }

      const connected = await checkDirectConnection();
      if (connected) return;

      const savedPairId = localStorage.getItem(PAIR_STORAGE_KEY);
      if (savedPairId) {
        locateLaptopByPairId(savedPairId);
      } else {
        // No está vinculado todavía
        statusSpinner.style.display = 'none';
        statusTitle.textContent = 'Vincula tu Celular';
        statusDesc.textContent = 'Apunta con la cámara de tu celular al código QR en la pantalla de tu Laptop por única vez.';
        btnScanQr.style.display = 'flex';
      }
    });
  </script>
</body>
</html>
